<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patro documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" />
  </head>
  <body class="loading sidebar-chevron-right">
    <div id="app"></div>

    <script>
      window.$docsify = {
        name: 'Patro',
        repo: 'fernando143/patro',
        loadSidebar: true,
        subMaxLevel: 2,
        search: {
          placeholder: 'Search documentation',
          noData: 'No results found',
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false });
      window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  </body>
</html>
